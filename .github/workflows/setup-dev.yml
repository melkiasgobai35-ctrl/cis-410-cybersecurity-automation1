name: "Setup — Dev Server"

on:
  workflow_dispatch:

jobs:
  setup:
    name: "Install Docker on Dev VM"
    runs-on: self-hosted

    steps:

      # ── Step 1: Configure restricted passwordless sudo ────────────────
      - name: Configure restricted passwordless sudo
        run: |
          echo "${{ secrets.DEV_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} \
            "set -e
            if sudo -n true 2>/dev/null; then
              echo '=== Passwordless sudo already configured — skipping ==='
            else
              echo '=== Configuring restricted passwordless sudo ==='
              printf '%s\n' '${{ secrets.SUDO_PASS }}' | sudo -S bash -c '
                echo \"${{ secrets.DEV_USER }} ALL=(ALL) NOPASSWD:/usr/bin/docker,/usr/bin/systemctl,/usr/sbin/usermod,/usr/bin/mkdir,/usr/bin/chown\" > /etc/sudoers.d/${{ secrets.DEV_USER }} &&
                chmod 0440 /etc/sudoers.d/${{ secrets.DEV_USER }}
              '
              echo '=== Passwordless sudo configured ==='
            fi"

          shred -u /tmp/deploy_key || rm -f /tmp/deploy_key


      # ── Step 2: Install Docker ────────────────────────────────────────
      - name: Install Docker on Dev VM
        run: |
          echo "${{ secrets.DEV_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} << 'EOF'
          set -e

          if ! command -v docker &> /dev/null; then
            echo "=== Docker not found — installing ==="

            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh

            sudo systemctl enable docker
            sudo systemctl start docker

            sudo usermod -aG docker $(whoami)
            newgrp docker || true

            sudo mkdir -p /opt/app
            sudo chown $(whoami):$(whoami) /opt/app

            rm get-docker.sh
            echo "=== Docker installed successfully ==="
          else
            echo "=== Docker already present — skipping install ==="

            sudo systemctl enable docker || true
            sudo systemctl start docker || true

            sudo mkdir -p /opt/app
            sudo chown $(whoami):$(whoami) /opt/app
          fi
          EOF

          shred -u /tmp/deploy_key || rm -f /tmp/deploy_key


      # ── Step 3: Verify Docker ─────────────────────────────────────────
      - name: Verify Docker
        run: |
          echo "${{ secrets.DEV_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} << 'EOF'
          set -e

          echo "=== Logged in as: $(whoami) ==="

          echo "=== Docker version ==="
          docker --version

          echo "=== Docker Compose version ==="
          docker compose version

          echo "=== Running test container ==="
          docker run --rm hello-world

          echo "=== Deployment directory ==="
          ls -la /opt/app

          echo "=== Dev server is ready for deployment ==="
          EOF

          shred -u /tmp/deploy_key || rm -f /tmp/deploy_key
