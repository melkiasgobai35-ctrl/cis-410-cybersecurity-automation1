name: "Deploy — Dev"

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Deploy to Dev VM"
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Validate secrets ─────────────────────────────────────────────
      - name: Validate required secrets
        run: |
          set -euo pipefail
          [ -n "${{ secrets.DEV_USER }}" ]
          [ -n "${{ secrets.DEV_HOST }}" ]
          [ -n "${{ secrets.DEV_SSH_KEY }}" ]
          echo "Secrets OK"

      # ── Setup SSH key (once) ────────────────────────────────────────
      - name: Setup SSH key
        run: |
          echo "${{ secrets.DEV_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # ── Ensure directory exists ─────────────────────────────────────
      - name: Prepare remote directory
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} \
            "sudo mkdir -p /opt/app && sudo chown ${{ secrets.DEV_USER }}:${{ secrets.DEV_USER }} /opt/app"

      # ── Validate project structure ──────────────────────────────────
      - name: Validate files
        run: |
          set -e
          [ -d app ] || (echo "Missing app/ directory" && exit 1)
          [ -f Dockerfile ] || (echo "Missing Dockerfile" && exit 1)
          [ -f docker-compose.yml ] || (echo "Missing docker-compose.yml" && exit 1)

      # ── Copy files (reliable sync) ──────────────────────────────────
      - name: Sync files to server
        run: |
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            ./app ./Dockerfile ./docker-compose.yml \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}:/opt/app/

      # ── Deploy (robust version) ─────────────────────────────────────
      - name: Deploy container
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} << 'EOF'
          set -e

          cd /opt/app

          echo "=== Starting deploy ==="

          # Ensure Docker is running
          sudo systemctl enable docker || true
          sudo systemctl start docker || true

          # Pull latest base images
          sudo docker compose pull || true

          # Rebuild + restart (no hard downtime)
          sudo docker compose up -d --build --remove-orphans

          echo "=== Containers ==="
          sudo docker compose ps

          echo "=== Deploy finished ==="
          EOF

      # ── Reliable health check ───────────────────────────────────────
      - name: Smoke test (with retry)
        run: |
          set -e

          for i in {1..10}; do
            if curl -fs http://${{ secrets.DEV_HOST }}:5000/health > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 3
          done

          echo "Smoke test failed"
          exit 1

      # ── Cleanup ─────────────────────────────────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: |
          shred -u /tmp/deploy_key || rm -f /tmp/deploy_key